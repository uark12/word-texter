name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WordTexter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WordTexter
          path: WordTexter.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Word Texter build ${{ github.run_number }}
          files: WordTexter.apk
